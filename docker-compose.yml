services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: botly
      POSTGRES_PASSWORD: botly
      POSTGRES_DB: botly
    ports:
      - "5433:5432"
    volumes:
      - botly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  botly_pgdata:
