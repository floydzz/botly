services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: botly
      POSTGRES_PASSWORD: botly
      POSTGRES_DB: botly
    ports:
      - "5433:5432"
    volumes:
      - botly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botly -d botly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://botly:botly@postgres:5432/botly
      TEST_DATABASE_URL: postgresql+asyncpg://botly:botly@postgres:5432/botly_test
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      BOTLY_DEMO_EMAIL: ${BOTLY_DEMO_EMAIL:-demo@botly.dev}
      BOTLY_DEMO_PASSWORD: ${BOTLY_DEMO_PASSWORD:-botly-demo}
      BOTLY_DEMO_NAME: ${BOTLY_DEMO_NAME:-Demo Operator}
      BOTLY_DEMO_MERCHANT: ${BOTLY_DEMO_MERCHANT:-Botly Demo Store}
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://botly:botly@postgres:5432/botly
      TEST_DATABASE_URL: postgresql+asyncpg://botly:botly@postgres:5432/botly_test
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "worker", "--loglevel=info"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  botly_pgdata:
